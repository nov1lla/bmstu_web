version: "3.9"

services:
  api-main:
    build:
      context: ..
      dockerfile: Api/Dockerfile
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      DB_USER: postgres
      DB_PASSWORD: Qazedctgb13
      DB_HOST: postgres
      DB_NAME: db_ppo
      DB_PORT: 5432
      APP_READ_ONLY: "false"
    expose:
      - "8080"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: Qazedctgb13
      POSTGRES_DB: db_ppo
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    expose:
      - "5432"

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - api-main
      - pgadmin
    ports:
      - "8088:80"
    volumes:
      - ./nginx/lab4.conf:/etc/nginx/nginx.conf:ro
      - ./static:/usr/share/nginx/html:ro

  pgadmin:
    image: dpage/pgadmin4:8
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    expose:
      - "80"

volumes:
  pgdata:
