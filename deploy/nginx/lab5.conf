worker_processes auto;

events {
  worker_connections 4096;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

  proxy_cache_path /var/cache/nginx levels=1:2 keys_zone=STATICCACHE:10m max_size=256m inactive=30m use_temp_path=off;

  map $request_method $api_upstream {
    default api_write;
    GET api_read;
    HEAD api_read;
    OPTIONS api_read;
  }

  map $request_method $mirror_api_upstream {
    default mirror_api_write;
    GET mirror_api_read;
    HEAD mirror_api_read;
    OPTIONS mirror_api_read;
  }

  upstream api_write {
    server api-main:8080 weight=1;
  }

  upstream api_read {
    server api-main:8080 weight=2;
    server api-read1:8080 weight=1;
    server api-read2:8080 weight=1;
  }

  upstream mirror_api_write {
    server api-mirror-main:8080 weight=1;
  }

  upstream mirror_api_read {
    server api-mirror-main:8080 weight=2;
    server api-mirror-read1:8080 weight=1;
    server api-mirror-read2:8080 weight=1;
  }

  server {
    listen 80;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    proxy_hide_header Server;
    add_header Server "GameDevicesStore" always;

    location = / {
      try_files /index.html =404;
    }

    location = /reserved {
      try_files /index.html =404;
    }

    location = /legacy {
      try_files /legacy.html =404;
    }

    location = /managment {
      try_files /managment.html =404;
    }

    location = /documentation {
      alias /usr/share/nginx/html/documentation/README.md;
      default_type text/markdown;
    }

    location ~ ^/api/v(1|2)(/.*)?$ {
      proxy_pass http://$api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location = /mirror {
      try_files /mirror/index.html =404;
    }

    location = /mirror/managment {
      try_files /managment.html =404;
    }

    location ~ ^/mirror/api/v(1|2)(/.*)?$ {
      rewrite ^/mirror(/.*)$ $1 break;
      proxy_pass http://$mirror_api_upstream;
      proxy_set_header Host $host;
      proxy_set_header X-Forwarded-Prefix /mirror;
    }

    location /mirror/ {
      alias /usr/share/nginx/html/mirror/;
      expires 10m;
      add_header X-Cache-Status "STATIC" always;
      try_files $uri $uri/ /mirror/index.html;
    }

    location /admin {
      proxy_pass http://pgadmin:80;
    }

    location = /monitoring {
      proxy_pass http://grafana:3000;
    }

    location = /status {
      stub_status on;
      access_log off;
      allow all;
    }

    location / {
      proxy_cache STATICCACHE;
      proxy_cache_valid 200 10m;
      expires 10m;
      add_header X-Cache-Status $upstream_cache_status always;
      try_files $uri $uri/ /index.html;
    }
  }
}
